<style>

</style></head><body><div id="app" class="t">
<div id="hud"><span id="h0"></span><span id="h1"></span><span id="h2"></span><span id="h3"></span></div>

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),c=cv.getContext('2d'),W=360,H=400,sh=$('#sheet');

S.sp=S.sp||[0,0,0];S.vib=S.vib??1;S.dq=S.dq||{d:'',p:[0,0,0],k:0};S.tu=S.tu||0;dq();

return{r:[300,300,300],g:20,b:{11:{t:'F',l:1,up:0},13:{t:'Q',l:1,up:0},21:{t:'M',l:1,up:0},23:{t:'A',l:1,up:0},17:{t:'G',l:1,up:0}},ar:[0,0,0],lvl:1,last:Date.now(),wk:1,st:0,day:'',log:[],sh:0}}

const lv=t=>Object.values(S.b).filter(b=>b.t==t).reduce((a,b)=>a+b.l,0),cap=()=>400+250*lv('E')+200*lv('G');

{const off=Math.min(3600,(Date.now()-S.last)/1000);produce(off);
if(off>900&&Date.now()>S.sh&&Math.random()<.6){const df=Object.values(S.b).reduce((a,b)=>a+(b.t=='T'?3*b.l:b.t=='P'?2*b.l:0),0),n=Math.round(S.r[0]*Math.max(.02,.15-df*.01));S.r[0]-=n;S.sh=Date.now()+72e5;S.log.unshift(`Un adversaire a pillé ${n} 🧶, il a abattu ta tour nord.`)}}

const[m,dk,lt]=COL[t],sw=Math.sin(fr*.9)*3,j=(R(fr,x|0)-.5)*1.2;

function drawTile(i,j,k){const[x,y]=pos(k),path=i==2||j==3;poly([[x,y-TH/2],[x+TW/2,y],[x,y+TH/2],[x-TW/2,y]],path?'#b8946a':(i+j)%2?'#79a04a':'#6f9644');
c.lineWidth=1;for(let n=0;n<4;n++){const px=x+(R(k,n)-.5)*40,py=y+(R(k,n,2)-.5)*18;c.strokeStyle=path?'#a07e55':'#5b8238';c.beginPath();c.moveTo(px,py);c.lineTo(px+1,py-3);c.stroke()}

function drawB(k,b){const[x,y0]=pos(k),y=y0+4,L=b.l||1,h=12+3*L,busy=b.up>Date.now()||!b.l;
if(!b.l){poly([[x,y-18],[x+22,y],[x,y+12],[x-22,y]],'#c9a06a55','#8a6030');c.fillStyle='#8a6030';c.fillRect(x-14,y-26,3,20);c.fillRect(x+12,y-26,3,20)}

else if(b.t=='Q'){box(x,y,20,h-4,'#8f4a2b','#b2603b','#c9764a');c.fillStyle='#d98a5a';c.beginPath();c.ellipse(x,y-h+2,15,10+L,0,3.14,0);c.fill();c.fillStyle='#1a0e08';c.beginPath();c.ellipse(x+8,y-4,6,5,0,0,7);c.fill();c.fillStyle=F%4<2?'#ff9a3a':'#ffc24a';c.beginPath();c.ellipse(x+8,y-3,3.5,3,0,0,7);c.fill();if(F%7==0)P.push({x:x-6,y:y-h-8,vx:3,vy:-18,l:1.2,m:1.2,col:'#9a948a',s:4,g:-3})}
else if(b.t=='M'){const gl=.25+.12*Math.sin(F*.4);c.fillStyle=`rgba(111,211,234,${gl})`;c.beginPath();c.arc(x,y-14,30,0,7);c.fill();box(x,y,22,h-2,'#55546a','#76758c','#8d8ca3');[[-8,-6,18],[0,-10,26],[9,-5,16]].forEach(([dx,dy,t])=>poly([[x+dx-4,y-h+dy+4],[x+dx,y-h-t+dy],[x+dx+4,y-h+dy+4]],'#7fe3f5','#e6fbff'))}
else if(b.t=='E'){box(x,y,22,h,'#6b4a2c','#8a6038','#a87a4a');c.strokeStyle='#3d2a18';c.lineWidth=2;c.beginPath();c.moveTo(x+6,y+8);c.lineTo(x+6,y-h+8);c.moveTo(x-8,y+3);c.lineTo(x-8,y-h+6);c.stroke();rect(x-8,y-h-10,16,10,'#e4cfa0',5)}
else if(b.t=='A'){box(x,y,22,h,'#6a4e32','#85643f','#a07a50');poly([[x-26,y-h+2],[x,y-h-20],[x+26,y-h+2],[x,y-h+14]],'#b3402e');rect(x+8,y-h-22,6,14,'#4a4a4a',1);const a=Math.sin(F*.8)*.6;c.save();c.translate(x-14,y-h-4);c.rotate(a);c.fillStyle='#777';c.fillRect(-1,-14,3,14);c.fillRect(-5,-17,11,5);c.restore()}
else{c.fillStyle='#7d776a';c.beginPath();c.ellipse(x,y-4,30+L*2,22+L*4,0,3.14,0);c.fill();c.fillStyle='#968f80';c.beginPath();c.ellipse(x-8,y-14-L,14,9,0,3.14,0);c.fill();c.fillStyle='#1a1410';c.beginPath();c.ellipse(x,y-2,11,14,0,3.14,0);c.fillRect(x-11,y-2,22,4);c.fill();
for(let n=0;n<L;n++){c.fillStyle='#ffd36b';c.fillRect(x+22,y-34-n*9,2,2);c.fillRect(x+21,y-30-n*9,4,2)}c.fillStyle='#b3402e';poly([[x+24,y-52],[x+38,y-47+Math.sin(F*.5)*2],[x+24,y-42]],'#b3402e');rect(x+23,y-54,2,28,'#4a3a2a',1)}

if(night()>0){const g2=c.createRadialGradient(x+14,y-6,0,x+14,y-6,22);g2.addColorStop(0,'rgba(255,190,90,.7)');g2.addColorStop(1,'rgba(255,190,90,0)');c.fillStyle=g2;c.fillRect(x-10,y-30,50,50)}}

const fmt=s=>s>=60?(s/60|0)+'min '+(s%60)+'s':s+'s';
function tree(x,y){const s=Math.sin(F*.3+x)*2;rect(x-3,y-14,6,16,'#5a3a22',2);[[0,-30,14],[-8,-22,10],[8,-22,10]].forEach(([dx,dy,r])=>{c.fillStyle='#4f7a34';c.beginPath();c.arc(x+dx+s*(1-dy/-30*.5),y+dy,r,0,7);c.fill()})}

function village(){
